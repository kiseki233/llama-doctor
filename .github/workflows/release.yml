name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        shell: pwsh
        run: |
          python -m pip install -e . pytest
          python -m pytest -q

      - name: Build Windows executables
        shell: pwsh
        run: ./scripts/build_windows.ps1

      - name: Create release archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/llama-doctor.exe,dist/llama-doctor-gui.exe -DestinationPath llama-doctor-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: llama-doctor-windows-x64
          path: llama-doctor-windows-x64.zip

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" llama-doctor-windows-x64.zip --generate-notes --title "$env:GITHUB_REF_NAME"
