[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llama-doctor"
version = "0.3.1.10731"
description = "Lint, diagnose and migrate llama.cpp commands against your installed build."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "llama-doctor contributors"}]
dependencies = [
  "typer>=0.12",
  "rich>=13.7"
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
dev = ["pytest>=8", "PySide6>=6.7"]

[project.scripts]
llama-doctor = "llama_doctor.cli:main"
llama-doctor-gui = "llama_doctor.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llama_doctor = ["rules/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
